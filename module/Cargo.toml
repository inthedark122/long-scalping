[package]
name = "long-scalping"
version = "1.0.130"
edition = "2021"

[features]
mrc-research = []
native-tools = []

[[bin]]
name = "module_entry"
path = "src/main.rs"

[[bin]]
name = "mrc_crossing_research"
path = "src/bin/mrc_crossing_research.rs"
required-features = ["mrc-research", "native-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the ABI with protection values on NewPosition events.
# Bump this rev (and `cargo update -p lte_strategy_bridge`) when fetching a new ABI.
lte_strategy_bridge = { git = "https://github.com/LivTorgEx/lte_strategy_bridge.git", rev = "fb86bc45643ef72831191cf2c8f42050cd776e06" }
ta = { path = "ta-rs" }
