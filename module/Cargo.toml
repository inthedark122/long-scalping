[package]
name = "long-scalping"
version = "1.0.62"
edition = "2021"

[features]
movement-research = []
native-tools = []

[[bin]]
name = "module_entry"
path = "src/main.rs"

[[bin]]
name = "movement_research"
path = "src/bin/movement_research.rs"
required-features = ["movement-research", "native-tools"]

[[bin]]
name = "direction_probe"
path = "src/bin/direction_probe.rs"
required-features = ["native-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the ABI that carries typed order updates and start-signal values.
# Bump this rev (and `cargo update -p lte_strategy_bridge`) when fetching a new ABI.
lte_strategy_bridge = { git = "https://github.com/LivTorgEx/lte_strategy_bridge.git", rev = "93f41563201cfc41a4d05269c139cd1db2efc53f" }
