[package]
name = "long-scalping"
version = "1.0.115"
edition = "2021"

[features]
mrc-research = []
native-tools = []

[[bin]]
name = "module_entry"
path = "src/main.rs"

[[bin]]
name = "mrc_crossing_research"
path = "src/bin/mrc_crossing_research.rs"
required-features = ["mrc-research", "native-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the ABI with module data requirements and raw kline snapshots.
# Bump this rev (and `cargo update -p lte_strategy_bridge`) when fetching a new ABI.
lte_strategy_bridge = { git = "https://github.com/LivTorgEx/lte_strategy_bridge.git", rev = "b3087bbc48e82a9c7d489a09fce825eee9f75c8f" }
ta = { path = "ta-rs" }
