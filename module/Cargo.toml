[package]
name = "long-scalping"
version = "1.0.15"
edition = "2021"

[features]
movement-research = []

[[bin]]
name = "module_entry"
path = "src/main.rs"

[[bin]]
name = "movement_research"
path = "src/bin/movement_research.rs"
required-features = ["movement-research"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the ABI that carries values on the Start SIGNAL (ModuleEvent::Signal { values }).
# Bump this rev (and `cargo update -p lte_strategy_bridge`) when fetching a new ABI.
lte_strategy_bridge = { git = "https://github.com/LivTorgEx/lte_strategy_bridge.git", rev = "b6f8fad2682d92f62ab23f786107e5a763edba4c" }
