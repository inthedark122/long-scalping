[package]
name = "long-scalping"
version = "1.0.134"
edition = "2021"

[features]
mrc-research = []
native-tools = []

[[bin]]
name = "module_entry"
path = "src/main.rs"

[[bin]]
name = "mrc_crossing_research"
path = "src/bin/mrc_crossing_research.rs"
required-features = ["mrc-research", "native-tools"]

[[bin]]
name = "mrc_window_research"
path = "src/bin/mrc_window_research.rs"
required-features = ["mrc-research", "native-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the ABI with protection values and strategy workflow reports.
# Bump this rev (and `cargo update -p lte_strategy_bridge`) when fetching a new ABI.
lte_strategy_bridge = { git = "https://github.com/LivTorgEx/lte_strategy_bridge.git", rev = "db65bd7b8882d964b2f9fb9246f5070fada0b54f" }
ta = { path = "ta-rs" }
